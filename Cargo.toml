[package]
name = "mdtools"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pro-vi/mdtools"
description = "Markdown-aware structural CLI and reusable Rust library"
readme = "README.crate.md"
include = [
    "src/**",
    "tests/**",
    "benches/**",
    "bench/inputs/t5_progress.md",
    "bench/inputs/t19_scale.md",
    "bench/inputs/t21_frontmatter.md",
    "Cargo.toml",
    "Cargo.lock",
    "README.crate.md",
    "CHANGELOG.md",
    "LICENSE",
]

[lib]
name = "mdtools"
path = "src/lib.rs"

[[bin]]
name = "md"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
file = []
cli = ["file", "dep:clap", "dep:walkdir"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
comrak = { version = "=0.51.0", default-features = false }
schemars = { version = "=1.2.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
libc = "0.2"
toml = "0.8"
walkdir = { version = "2", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "core"
harness = false

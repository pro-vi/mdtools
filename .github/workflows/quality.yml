name: quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-evaluation-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source and historical producer pins
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install Rust for explicit offline producer builds
        run: |
          rustup toolchain install stable
          rustup default stable

      - name: Install hash-locked Python dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r bench/requirements.lock

      - name: Run portable synthetic evaluation closure
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q --strict-markers \
            bench/test_harness_run_artifacts.py bench/test_harness_task_split.py \
            bench/test_native_runner.py bench/test_harness_json.py \
            bench/test_neutral_scorer.py bench/test_prompt_neutrality.py \
            bench/test_command_policy.py bench/test_manifest.py bench/test_trial_records.py \
            bench/test_agg_util.py bench/test_stats.py bench/test_report_inputs.py \
            bench/test_claude_containment.py bench/test_harness_refactor.py \
            bench/test_campaign_admission.py bench/test_campaign_config.py \
            bench/test_prompt_comparison.py

      - name: Run isolated default synthetic entry point
        run: python -I bench/harness.py --offline-exercise

      - name: Record offline evidence limits
        if: ${{ always() }}
        run: |
          echo 'This job runs synthetic subprocesses and explicit producer builds. It has no model credentials, model calls, holdout-content reads, or raw-trace uploads. macOS native containment and local Claude fixture checks are not exercised on Linux.' >> "$GITHUB_STEP_SUMMARY"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Rust tests
        run: cargo test --all-targets

      - name: Run doctests
        run: cargo test --doc

      - name: Check feature boundaries
        run: |
          cargo check --no-default-features
          cargo check --features file

      - name: Run transaction invariants without default features
        run: cargo test --no-default-features --test transaction_invariants

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::enum_variant_names -A clippy::large_enum_variant

      - name: Check rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --document-private-items

      - name: Build release binary
        run: cargo build --release

      - name: Record hosted run URL
        if: ${{ always() }}
        run: |
          echo "Hosted quality run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"

  # Keep this job id while the downstream pi-mdtools adapter migrates separately.
  # The v3 rewrite deliberately removes the v2 evidence surface, so the old
  # adapter cannot be a producer-side parity gate. This job now pins the current
  # binary-owned v3 command and schema boundary instead.
  pi-mdtools-consumer-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out mdtools (this ref)
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable

      - name: Build md from this ref
        run: cargo build --release

      - name: Verify the v3 producer contract
        run: |
          target/release/md schema > schema.json
          jq -e '.schema_version == "mdtools.v3"' schema.json
          jq -e '[.commands[].name] == ["map", "read", "query", "patch", "schema"]' schema.json
          jq -e '(.target_query.oneOf | map(select(.properties.type.const == "search")) | length) == 1' schema.json
          jq -e '.target_query.oneOf[] | select(.properties.type.const == "search") | (.required | index("max_results")) != null and .properties.max_results.minimum == 1' schema.json
